# Devices for Waveshare ESP32-P4-WIFI6-Touch-LCD-4B
devices:
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        is_master: false
        no_mclk: false
    peripherals:
      - pa_name: gpio_pa_control
        gain: 6
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      sys_cfg:
        is_master: false
        no_mclk: false
      adc_cfg:
        digital_mic: false
        label: [FL, RE, FR, NA]
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x80
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 8
        allocation_unit_size: 65536
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins:
          clk: 0
          cmd: 0
          d0: 0
          d1: 0
          d2: 0
          d3: 0
          d4: 0
          d5: 0
          d6: 0
          d7: 0
          cd: -1
          wp: -1
        ldo_chan_id: 4

  - name: display_lcd
    chip: st7703
    type: display_lcd
    sub_type: dsi
    version: default
    dependencies:
      waveshare/esp_lcd_st7703: "^2.0.0"
    config:
      invert_color: false
      need_reset: true
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 16
      frame_format: RGB565_BE
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 38
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: true
          disable_lp: false
        video_timing:
          h_size: 720
          v_size: 720
          hsync_back_porch: 50
          hsync_pulse_width: 20
          hsync_front_porch: 50
          vsync_back_porch: 20
          vsync_pulse_width: 4
          vsync_front_porch: 20
    peripherals:
      - ldo_name: ldo_mipi
      - dsi_name: dsi_display

  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        control_phase_bytes: 1
        lcd_cmd_bits: 16
        lcd_param_bits: 0
        scl_speed_hz: 400000
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 720
        y_max: 720
        rst_gpio_num: -1
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - i2c_name: i2c_master
        i2c_addr: [0xBA, 0x28]

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight
