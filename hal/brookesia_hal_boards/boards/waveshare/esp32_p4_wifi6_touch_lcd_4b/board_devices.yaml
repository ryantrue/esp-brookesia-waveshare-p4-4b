# Devices for Waveshare ESP32-P4-WIFI6-Touch-LCD-4B
devices:
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    dependencies:
      # ESP-SR 2.4.x rejects ESP32-P4 rev<3 with ESP-IDF 6.1 at CMake time.
      # 2.5.0 added IDF 6.1 compatibility; keep this as a board-local lower
      # bound so compatible 2.x fixes can be picked up without patching Brookesia.
      espressif/esp-sr: ">=2.5.0,<3.0.0"
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 4
      adc_channel_mask: "0111"
      adc_channel_labels: [NA, RE, FR, FL]
      adc_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x80
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins:
          clk: 0
          cmd: 0
          d0: 0
          d1: 0
          d2: 0
          d3: 0
          d4: 0
          d5: 0
          d6: 0
          d7: 0
        ldo_chan_id: 4

  - name: display_lcd
    chip: st7703
    type: display_lcd
    sub_type: dsi
    version: default
    dependencies:
      waveshare/esp_lcd_st7703: "^2.0.0"
      # Board-local compatibility constraint: LVGL 9.6.0 currently fails to
      # compile its FreeType bridge against ESP-IDF 6.1. Keep this out of the
      # shared System Super manifest so upstream merges remain conflict-free.
      lvgl/lvgl: "==9.5.0"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 38
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: true
          disable_lp: false
        video_timing:
          h_size: 720
          v_size: 720
          hsync_back_porch: 50
          hsync_pulse_width: 20
          hsync_front_porch: 50
          vsync_back_porch: 20
          vsync_pulse_width: 4
          vsync_front_porch: 20
    peripherals:
      - name: ldo_mipi
      - name: dsi_display

  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
      touch_config:
        x_max: 720
        y_max: 720
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0xBA, 0x28]

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight
