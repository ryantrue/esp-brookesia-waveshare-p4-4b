name: Waveshare P4-4B Build

on:
  pull_request:
    branches:
      - waveshare-p4-4b
    paths:
      - "hal/brookesia_hal_boards/**"
      - "hal/brookesia_hal_adaptor/**"
      - "examples/system/super/**"
      - ".github/workflows/waveshare-p4-4b-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-system-super:
    name: ESP-IDF 6.1 / System Super / rev1.x
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
      options: --user root
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Waveshare board
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py --version
          cd examples/system/super
          python -m pip install --disable-pip-version-check --upgrade -r requirements.waveshare-p4-4b.txt
          python -c 'from importlib.metadata import version; print("idf-component-manager", version("idf-component-manager"))'
          rm -rf build sdkconfig managed_components dependencies.lock components/gen_bmgr_codes build.log
          idf.py gen-bmgr-config -b esp32_p4_wifi6_touch_lcd_4b

          echo "===== GENERATED BOARD DEFAULTS ====="
          grep -E 'CONFIG_ESPTOOLPY_FLASHSIZE_32MB=|CONFIG_ESP32P4_SELECTS_REV_LESS_V3=|CONFIG_ESP32P4_REV_MIN_100=|CONFIG_SPIRAM_SPEED_200M=|CONFIG_BROOKESIA_HAL_ADAPTOR_AUDIO_ENABLE_PROCESSOR_IMPL=|CONFIG_LV_CONF_MINIMAL' components/gen_bmgr_codes/board_manager.defaults

      - name: Build System Super
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd examples/system/super
          idf.py -B build -D BROOKESIA_CXX_JOBS=3 build 2>&1 | tee build.log

      - name: Verify Waveshare configuration
        shell: bash
        run: |
          set -euo pipefail
          cd examples/system/super

          # Guard against upstream changes silently dropping board capabilities.
          grep -q '^CONFIG_IDF_TARGET="esp32p4"$' sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y$' sdkconfig
          grep -q '^CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y$' sdkconfig
          grep -q '^CONFIG_ESP32P4_REV_MIN_100=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_SPEED_200M=y$' sdkconfig
          grep -q '^CONFIG_BROOKESIA_HAL_ADAPTOR_AUDIO_ENABLE_PROCESSOR_IMPL=y$' sdkconfig
          grep -q '^# CONFIG_LV_CONF_MINIMAL is not set$' sdkconfig

          echo "===== RESOLVED WAVESHARE BOARD CONFIG ====="
          grep -E 'CONFIG_IDF_TARGET=|CONFIG_ESPTOOLPY_FLASHSIZE_32MB=|CONFIG_ESP32P4_SELECTS_REV_LESS_V3=|CONFIG_ESP32P4_REV_MIN_100=|CONFIG_SPIRAM_SPEED_200M=|CONFIG_BROOKESIA_HAL_ADAPTOR_AUDIO_ENABLE_PROCESSOR_IMPL=|CONFIG_LV_CONF_MINIMAL' sdkconfig
          echo "===== RESOLVED AUDIO DEPENDENCIES ====="
          grep -A4 -B2 -E 'espressif/esp-sr|jason-mao/av_processor|espressif/gmf_ai_audio' dependencies.lock || true
          grep -q 'version: 2.5.3' dependencies.lock

      - name: Print build diagnostics
        if: failure()
        shell: bash
        run: |
          cd examples/system/super
          echo "===== FIRST ACTIONABLE BUILD ERRORS ====="
          grep -nEi 'error:|fatal error:|FAILED:|CMake Error|undefined reference|No such file|not found|version solving failed|requirements are unsatisfiable' build.log | tail -160 || true
          echo "===== END OF BUILD LOG ====="
          tail -160 build.log || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-p4-4b-build-diagnostics
          path: |
            examples/system/super/build.log
            examples/system/super/sdkconfig
            examples/system/super/dependencies.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Collect flash package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd examples/system/super
          mkdir -p build/firmware-package
          cp build/*.bin build/firmware-package/ 2>/dev/null || true
          cp build/bootloader/bootloader.bin build/firmware-package/ 2>/dev/null || true
          cp build/partition_table/partition-table.bin build/firmware-package/ 2>/dev/null || true
          cp build/flash_args build/firmware-package/ 2>/dev/null || true
          cp build/flasher_args.json build/firmware-package/ 2>/dev/null || true
          cp build/project_description.json build/firmware-package/ 2>/dev/null || true
          ls -lh build/firmware-package

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-p4-4b-system-super-idf61
          path: examples/system/super/build/firmware-package/
          if-no-files-found: error
          retention-days: 14
