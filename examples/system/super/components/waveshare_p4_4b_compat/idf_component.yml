version: "1.0.0"
description: "Dependency compatibility for Waveshare ESP32-P4-WIFI6-Touch-LCD-4B on ESP-IDF 6.1"

# ESP-Brookesia 0.8 currently reaches esp-sr 2.4.4 through
# av_processor -> gmf_ai_audio. esp-sr 2.4.4 rejects ESP32-P4 rev<3 on
# ESP-IDF 6.1 at CMake time. ESP-SR 2.5.0 fixed the IDF 6.1 Kconfig
# incompatibility; pin the current stable patch release while keeping the
# Brookesia audio processor/AFE enabled.
overrides:
  - espressif/esp-sr:
      with:
        espressif/esp-sr:
          version: "2.5.3"
      reason: "ESP32-P4 rev1.x + ESP-IDF 6.1 requires ESP-SR 2.5.x"
